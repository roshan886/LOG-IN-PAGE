<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container"><div class="mouse"></div>
        
        <div class="circle circle1"></div>
        <div class="circle"></div>
        <div class="form">
            <H1>contact form</H1>
            <form >
            <div class="nameBox same">
                 <small class="NameError" >Name Error</small>
                    <input type="text" id="name" spellcheck="false" placeholder="Enter Your Name ">
                    <label for="name">Enter Name</label>
            </div>
            <div class="phneNo same">
                <small class="phoneError">Phone Error</small>
                <input type="text" id="phone" placeholder="Enter Your Phone">
                <label for="Phone">Phone No</label>
            </div>
            <div class="address same">
                <div class="inputboxOfaddress same">
                    <input type="text" id="comments" placeholder="Enter Comments">
                    <small class="addressError">Addres Error</small>
                </div>
                <label for="comments">Enter Comments</label>
            </div>
        
            <div class="btnbox">
                <button>Submit</button>
            </div>


            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
